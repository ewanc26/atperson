services:
  atperson:
    build:
      context: .
      dockerfile: Dockerfile
    image: atperson:latest
    container_name: atperson
    environment:
      - ATPERSON_HOME=/var/lib/atperson
      - ATPERSON_IDENTIFIER=${ATPERSON_IDENTIFIER:-}
      - ATPERSON_APP_PASSWORD=${ATPERSON_APP_PASSWORD:-}
      - ATPERSON_SERVICE=${ATPERSON_SERVICE:-https://bsky.social}
      - ATPERSON_TYPESAFE_API_KEY=${ATPERSON_TYPESAFE_API_KEY:-}
      # Remote operator channel (#143). Inert unless ATPERSON_OPERATOR_DID
      # names a DID that is not the entity's own account, so an unset value
      # costs nothing: no DID, no commands, no session. The operator
      # credential is used only to publish requests from the operator's own
      # client; the daemon authenticates as the entity and never as the
      # operator.
      - ATPERSON_OPERATOR_DID=${ATPERSON_OPERATOR_DID:-}
      - ATPERSON_OPERATOR_IDENTIFIER=${ATPERSON_OPERATOR_IDENTIFIER:-}
      - ATPERSON_OPERATOR_APP_PASSWORD=${ATPERSON_OPERATOR_APP_PASSWORD:-}
    volumes:
      - atperson-data:/var/lib/atperson
    restart: unless-stopped
    command: daemon
    # Supervisor health surface (#143/#168): the daemon refreshes
    # <data>/autonomy-heartbeat.json every completed cycle; this poll
    # exits 0 healthy, 1 stale, 2 unreadable/never started. start_period
    # covers the first cycle before any heartbeat exists.
    healthcheck:
      test: ["CMD", "atperson", "autonomy", "health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10m
    # Optional resource limits: the atperson runtime probes cgroup memory/CPU
    # limits on Linux and dynamically scales its graph and write budgets.
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '2.0'
    #       memory: 1G

volumes:
  atperson-data:
