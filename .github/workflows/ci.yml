name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # NOTE: `cmake --build <dir> --parallel` (no job count) resolves to the
  # native processor count and *ignores* CMAKE_BUILD_PARALLEL_LEVEL, so the
  # bound is passed explicitly as `--parallel 2` on every build step below.
  # The env var is kept for any tooling that reads it directly.
  CMAKE_BUILD_PARALLEL_LEVEL: "2"
  # glibc gives each thread its own malloc arena; on a multi-core runner that
  # inflates GCC's resident set well past what the same build needs. Two
  # arenas is the standard cap and does not change compiler behaviour.
  MALLOC_ARENA_MAX: "2"

jobs:
  core:
    name: Core (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-latest
            cc: gcc
            cxx: g++
          - name: Linux Clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
          - name: macOS Clang
            os: macos-latest
            cc: clang
            cxx: clang++
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v5
      - name: Configure core-only build
        run: cmake -S . -B build -DATPERSON_BUILD_NETWORK=OFF -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure -LE bench --timeout 300

  sanitizers:
    name: Core (ASan + UBSan)
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v5
      - name: Configure sanitizer build
        run: >-
          cmake -S . -B build
          -DATPERSON_BUILD_NETWORK=OFF
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure -LE bench --timeout 300

  network:
    name: Network (Linux GCC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Wolfram system dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev pkg-config
      - name: Configure full build
        run: cmake -S . -B build -DATPERSON_BUILD_NETWORK=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure -LE bench --timeout 300

  smoke-fuzz:
    name: Bounded smoke fuzz (Clang, 30s per target)
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v5
      - name: Configure fuzz build
        run: >-
          cmake -S . -B build-fuzz
          -DATPERSON_BUILD_NETWORK=OFF
          -DATPERSON_BUILD_FUZZ=ON
          -DCMAKE_BUILD_TYPE=Debug
      - name: Build fuzz targets
        run: >-
          cmake --build build-fuzz --parallel 2
          --target snapshot-load-fuzzer ledger-open-fuzzer tokenize-fuzzer
      - name: Smoke fuzz snapshot load
        run: ./build-fuzz/snapshot-load-fuzzer -max_total_time=30 fuzz/corpus/snapshot
      - name: Smoke fuzz ledger open
        run: ./build-fuzz/ledger-open-fuzzer -max_total_time=30 fuzz/corpus/ledger
      - name: Smoke fuzz tokenizer
        run: ./build-fuzz/tokenize-fuzzer -max_total_time=30 fuzz/corpus/tokenize
