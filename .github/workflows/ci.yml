name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure core-only build
        run: cmake -S . -B build -DATPERSON_BUILD_NETWORK=OFF -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Wolfram system dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev pkg-config
      - name: Configure full build
        run: cmake -S . -B build -DATPERSON_BUILD_NETWORK=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
